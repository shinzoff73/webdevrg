<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Object Landing Page</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Create the scene
        const scene = new THREE.Scene();
        
        // Create a camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // Create a renderer and add it to the document
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Create a torus geometry and a material, then combine them into a mesh
        const geometry = new THREE.TorusGeometry(1, 0.4, 16, 100);
        const material = new THREE.MeshBasicMaterial({ color: 0x0077ff, wireframe: true });
        const torus = new THREE.Mesh(geometry, material);
        
        // Add the torus to the scene
        scene.add(torus);
        
        // Move the camera away from the torus
        camera.position.z = 5;
        
        // Create an animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate the torus for some simple animation
            torus.rotation.x += 0.01;
            torus.rotation.y += 0.01;
            
            // Render the scene from the perspective of the camera
            renderer.render(scene, camera);
        }
        
        // Start the animation loop
        animate();
        
        // Adjust the scene when the window is resized
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
